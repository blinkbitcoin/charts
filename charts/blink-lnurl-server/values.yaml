secrets:
  create: true
  dbUrl: ""
  sspAuthSeed: ""
  nsec: ""
  caCert: ""
  proxycheckApiKey: ""
blinkLnurlServer:
  address: "0.0.0.0:8080"
  autoMigrate: "true"
  deploymentEnv: "production"
  sparkEnabled: "true"
  blinkEnabled: "true"
  domains: "localhost:8080"
  callbackDomain: ""
  sparkNetwork: ""
  blinkGraphqlEndpoint: ""
  scheme: "https"
  webhookDomain: ""
  logLevel: "info"
  minSendable: "1000"
  maxSendable: "4000000000"
  webhookDeliveryTtlDays: "90"
  crlUrl: ""
  internalJwksUrl: ""
  internalJwksPath: ""
  internalJwtIssuer: ""
  internalJwtAudience: ""
  modeRequestsPerIpPerMinute: ""
  countryLookupsPerDay: ""
waitForInternalJwks:
  enabled: false
  image: curlimages/curl:8.10.1
  pullPolicy: IfNotPresent
  timeoutSeconds: 120
  intervalSeconds: 2
image:
  repository: us.gcr.io/galoy-org/blink-lnurl-server
  digest: "sha256:c58e3d1324c9ce515b343b83f22db76ed938540212e95a78d7a5e1fd52197df7" # METADATA:: repository=https://github.com/blinkbitcoin/blink-lnurl-server;commit_ref=ac51f58;app=blink-lnurl-server;
ingress:
  enabled: false
  hosts: []
  rulesOverride: null
  extraTls: []
  # Additional annotations merged onto the Ingress (e.g. nginx rate-limit / server-snippet).
  # cert-manager.io/cluster-issuer is fixed to letsencrypt-issuer; a user value for this key is ignored.
  annotations: {}
service:
  port: 8080
  type: ClusterIP
resources: {}
