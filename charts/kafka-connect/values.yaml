## The image is built with the Dockerfile in /images/kafka-connect
image:
  repository: us.gcr.io/galoy-org/kafka-connect
  digest: sha256:0cea4789f3b0d26e45ad83bd8ac5897cb083214ea46d561e8c1a7758232fc46e
  git_ref: a58dfd9
# Kubernetes resource identity only; does not select the Kafka worker group.
kafkaConnectInstanceName: kafka
# Durable worker group and prefix for all three internal topics.
# Keep the legacy default on upgrades; changing it starts with fresh state.
# Independent workers sharing brokers must explicitly choose unique IDs.
connectClusterId: connect-cluster
## The pods from this namespace are allowed to access the Kafka Connect API
allowedNamespace: ""
## The contents of the secrets are mounted as a file to be used by the Kafka connectors running in the pod
## mounts to: /opt/kafka/external-configuration/<secretName>/<data.value>
secretMounts: []
resources: {}
