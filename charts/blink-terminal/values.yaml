global:
  security:
    allowInsecureImages: true
secrets:
  create: true
  databaseUrl: ""
  redisPassword: ""
  jwtSecret: ""
  encryptionKey: ""
  networkEncryptionKey: ""
  blinkposApiKey: ""
  blinkposBtcWalletId: ""
  blinkWebhookSecret: ""
  citrusrateApiKey: ""
blinkTerminal:
  blinkApiUrl: "http://galoy-oathkeeper-proxy.galoy-dev-galoy.svc.cluster.local:4455/graphql"
  blinkEnvironment: "staging"
  redisHost: "localhost"
  redisPort: "6379"
  redisDb: "0"
  enableHybridStorage: "false"
  loglevel: "info"
  otelExporterOtlpEndpoint: http://localhost:4318
  tracingServiceName: "blink-terminal"
  # Bolt Card spending (tap-to-pay). Only "true" enables it; requires the
  # tap-bound single-use k1 (blink-terminal migration 024).
  boltcardSpendEnabled: "false"
  citrusrateBaseUrl: "https://citrusrate-be.onrender.com"
image:
  repository: us.gcr.io/galoy-org/blink-terminal
  digest: "sha256:f8496f08a9dff425cd53484a9953e3423eab5c81606123c7ff38371b151b8f2a" # METADATA:: repository=https://github.com/blinkbitcoin/blink-terminal;commit_ref=2243e4c;app=blink-terminal;
psqlImage: "postgres:15"
ingress:
  enabled: false
service:
  port: 3000
  type: ClusterIP
postgresql:
  image:
    repository: bitnamilegacy/postgresql
  enabled: true
  auth:
    enablePostgresUser: false
    username: blink_terminal
    password: blink_terminal
    database: blink_terminal
resources: {}
