global:
  security:
    allowInsecureImages: true
# Non-secret version of an externally managed secret (secrets.create=false),
# e.g. its resourceVersion. A change rolls the pod so it picks up the new
# values (env vars are read at pod start).
secretVersion: ""
secrets:
  create: true
  databaseUrl: ""
  redisPassword: ""
  jwtSecret: ""
  encryptionKey: ""
  # Previous ENCRYPTION_KEY(s), comma-separated, set only during a rotation.
  encryptionKeyPrevious: ""
  networkEncryptionKey: ""
  blinkposApiKey: ""
  blinkposBtcWalletId: ""
  blinkWebhookSecret: ""
  citrusrateApiKey: ""
blinkTerminal:
  blinkApiUrl: "http://galoy-oathkeeper-proxy.galoy-dev-galoy.svc.cluster.local:4455/graphql"
  blinkEnvironment: "staging"
  redisHost: "localhost"
  redisPort: "6379"
  redisDb: "0"
  enableHybridStorage: "false"
  loglevel: "info"
  otelExporterOtlpEndpoint: http://localhost:4318
  tracingServiceName: "blink-terminal"
  # Bolt Card spending (tap-to-pay). Only "true" enables it; requires the
  # tap-bound single-use k1 (blink-terminal migration 024).
  boltcardSpendEnabled: "false"
  # ENCRYPTION_WRITE_FORMAT: "" (unset = app default "legacy", rollback-safe)
  # or "v2" once a blink-terminal release with the keyring is deployed
  # (blink-wip#1587).
  encryptionWriteFormat: ""
  citrusrateBaseUrl: "https://citrusrate-be.onrender.com"
image:
  repository: us.gcr.io/galoy-org/blink-terminal
  digest: "sha256:efcf9a4587309d71b7792d5bb7ccae04e3fbdc82adc6e039909b9f4bc1ee79aa" # METADATA:: repository=https://github.com/blinkbitcoin/blink-terminal;commit_ref=22e1fff;app=blink-terminal;
psqlImage: "postgres:15"
ingress:
  enabled: false
service:
  port: 3000
  type: ClusterIP
postgresql:
  image:
    repository: bitnamilegacy/postgresql
  enabled: true
  auth:
    enablePostgresUser: false
    username: blink_terminal
    password: blink_terminal
    database: blink_terminal
resources: {}
